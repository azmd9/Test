name: Daily Currency Rate Retrieval

on:
  schedule:
    # 17:23 UTC, Mon-Fri. ECB publishes EUR reference rates ~14:00 UTC on
    # TARGET working days; this leaves a ~3.5h buffer past publication and
    # skips weekends when ECB doesn't publish. Off-the-hour minute reduces
    # GitHub Actions scheduler queueing delays.
    - cron: "23 17 * * 1-5"
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write

jobs:
  fetch-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch currency rates
        env:
          CURRENCY_PAIRS: ${{ vars.CURRENCY_PAIRS || 'EUR:USD,EUR:CNY,EUR:BRL,EUR:BGN,EUR:GBP,EUR:SGD,EUR:TRY,EUR:SEK,EUR:ILS,EUR:CHF,EUR:KRW,EUR:PHP,EUR:JPY,EUR:HKD,EUR:IDR,EUR:THB,EUR:DKK,EUR:AED,EUR:CLP,EUR:RUB,EUR:SAR,EUR:PEN,EUR:MAD,EUR:COP,EUR:ARS,CNY:SGD,CNY:USD' }}
        run: python main.py

      - name: Commit and push rate data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.xlsx
          git diff --cached --quiet || git commit -m "chore: update currency rates for $(date -u +%Y-%m-%d)"
          git push
