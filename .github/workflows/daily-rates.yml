name: Daily Currency Rate Retrieval

on:
  schedule:
    # Run daily at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write

jobs:
  fetch-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch currency rates
        env:
          BASE_CURRENCY: ${{ vars.BASE_CURRENCY || 'USD' }}
          TARGET_CURRENCIES: ${{ vars.TARGET_CURRENCIES || 'EUR,GBP,JPY,CAD,AUD,CHF,CNY,INR,BRL,MXN' }}
        run: python main.py

      - name: Commit and push rate data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update currency rates for $(date -u +%Y-%m-%d)"
          git push
